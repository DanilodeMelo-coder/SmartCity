<!DOCTYPE html>

<html lang="pt-br">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cadastro - Segurança Pública</title>
    <link rel="stylesheet" href="cadastro.css"/>
</head>
<body>

<div class="card">
    <div class="header">
    <div class="avatar">👤</div>
    <div>
        <h1>Cadastro de Cidadão</h1>
        <p>Segurança Pública – Central de Monitoramento</p>
    </div>
</div>

    <div class="erro" id="erro"></div>
    <div class="sucesso" id="sucesso"></div>

    <label>Nome completo <span class="obrigatorio">*</span></label>
    <input type="text" id="nome" placeholder="Ex.: Rafael Moura Ferreira"/>

    <label>CPF <span class="obrigatorio">*</span></label>
    <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14"/>

    <label>Telefone <span class="obrigatorio">*</span></label>
    <input type="text" id="telefone" placeholder="(11) 99999-9999" maxlength="15"/>

    <label>Data de nascimento <span class="obrigatorio">*</span></label>
    <input type="date" id="dataNascimento"/>

    <label>E-mail <span class="opcional">(opcional)</span></label>
    <input type="email" id="email" placeholder="exemplo@email.com"/>

    <label>Senha <span class="obrigatorio">*</span></label>
    <input type="password" id="senha" placeholder="Mínimo 8 caracteres"/>

    <label>Confirmar senha <span class="obrigatorio">*</span></label>
    <input type="password" id="confirmarSenha" placeholder="Repita a senha"/>

    <button onclick="cadastrar()">Cadastrar</button>

    <p class="rodape">Já tem cadastro? <a href="../login/login.html">Entrar</a></p>
</div>

<script src="cadastro.js"></script>
</body>
</html>
